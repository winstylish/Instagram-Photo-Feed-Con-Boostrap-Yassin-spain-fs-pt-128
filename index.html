<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post-Instagram-Feed</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <!-- Enlace estable a FA 6 Free, los otros no funcionan... -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- El navBar de Instagram con Bootstrap 5 -->

  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <i class="fa-brands fa-instagram"></i>
      <a class="navbar-brand fw-bold" href="#">Instagram</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>


      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <form class="d-flex ms-auto" role="search">

          <!-- Button trigger del modal -->
          <button type="button" class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#exampleModal"
            data-bs-whatever="@mdo">Create a new post here</button>

          <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
            aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">

                <div class="modal-header">

                  <h1 class="modal-title fs-5" id="exampleModalLabel">Create a new post</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                </div>

                <div class="modal-body">

                  <div class="mb-3">

                    <label for="recipient-name" class="col-form-label">Caption:</label>
                    <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2"></textarea>

                  </div>

                  <button type="button btn mx-1 bg-light border" class="btn btn-outline-secondary"><i
                      class="fa-solid fa-camera"></i></button>
                  <button type="button btn mx-1 bg-light border" class="btn btn-outline-secondary"><i
                      class="fa-solid fa-location-dot"></i></button>

                </div>

                <div class="modal-footer d-grid gap-2 d-md-flex justify-content-md-end mx-2 mb-2">

                  <button class="btn btn-secondary" type="button">Close</button>
                  <button class="btn btn-success" type="button">Publish</button>

                </div>

              </div>
            </div>
          </div>

          <div class="btn-group ms-2">
            <button type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown"
              data-bs-display="static" aria-expanded="false">
              <i class="fa-solid fa-gear"></i>
            </button>

            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-lg-end">
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><a class="dropdown-item" href="#">Accessibility</a></li>
              <li><a class="dropdown-item" href="#">Privacy and Data</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><a class="dropdown-item text-danger" href="#">Exit</a></li>
            </ul>
          </div>



        </form>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home"
          type="button" role="tab" aria-controls="pills-home" aria-selected="true"><i
            class="fa-solid fa-grid"></i></button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-profile-tab"
          type="button" role="tab" aria-controls="pills-home" aria-selected="true"><i
            class="fa-solid fa-square"></i></button>
      </li>

    </ul>

    <div class="tab-content" id="pills-tabContent">

      <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab"
        tabindex="0">pagina row</div>
      <div class="tab-pane fade show active" id="pills-profile-tab" role="tabpanel" aria-labelledby="pills-profile-tab"
        tabindex="0">pagina columna</div>

    </div>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-NXMBENP0W7EwDq1VufpCnA0Q6puVShGHEiJFBu8yBBE3xO2UCC08t6M5Q6m9K3OG"
    crossorigin="anonymous"></script>
  </script>
</body>

</html>
